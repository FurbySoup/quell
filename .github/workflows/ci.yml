name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (default features)
        run: cargo build --workspace --verbose

      - name: Build (recording feature)
        run: cargo build --workspace --features recording --verbose

      - name: Run tests (default features)
        run: cargo test --workspace --verbose

      - name: Run tests (recording feature)
        run: cargo test --workspace --features recording --verbose

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (recording feature)
        run: cargo clippy --workspace --all-targets --features recording -- -D warnings

  build-gui-frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: gui/src-frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('gui/src-frontend/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: gui/src-frontend
        run: npm ci

      - name: Build frontend (TypeScript + Vite)
        working-directory: gui/src-frontend
        run: npm run build

  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0

      - name: Audit dependencies
        run: cargo audit

      - name: Deny check
        run: cargo deny check
