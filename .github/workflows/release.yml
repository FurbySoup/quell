name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: gui/src-frontend
        run: npm ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build CLI binary
        run: cargo build --release -p quell-cli

      - name: Build GUI installer
        working-directory: gui/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Generate checksums
        shell: pwsh
        run: |
          $cliHash = (Get-FileHash target/release/quell.exe -Algorithm SHA256).Hash
          "$cliHash  quell.exe" | Out-File -Encoding ascii -FilePath target/release/quell.exe.sha256

          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$installerHash  $($installer.Name)" | Out-File -Encoding ascii -FilePath "target/release/bundle/nsis/$($installer.BaseName).sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/quell.exe
            target/release/quell.exe.sha256
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
          generate_release_notes: true
