<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ipc: http://ipc.localhost https://ipc.localhost ws://localhost:1420 http://localhost:1420" />
  <title>Quell</title>
  <link rel="stylesheet" href="/src/theme.css" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="tab-bar">
    <div id="tabs"></div>
    <button id="tab-new" title="New tab">+</button>
  </div>
  <div id="terminals">
    <div id="search-overlay" hidden>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search..." spellcheck="false" />
        <button id="search-regex" class="search-toggle" title="Regex">.*</button>
        <button id="search-case" class="search-toggle" title="Case sensitive">Aa</button>
        <button id="search-word" class="search-toggle" title="Whole word">ab</button>
        <span class="search-count" id="search-count"></span>
        <button id="search-prev" class="search-nav" title="Previous (Shift+F3)">&#x2191;</button>
        <button id="search-next" class="search-nav" title="Next (F3)">&#x2193;</button>
        <button id="search-close" class="search-close" title="Close (Esc)">&times;</button>
      </div>
    </div>
  </div>
  <div id="palette-overlay" hidden>
    <div class="palette">
      <input type="text" id="palette-input" placeholder="Type a command..." spellcheck="false" />
      <div class="palette-results" id="palette-results"></div>
    </div>
  </div>
  <div id="shortcuts-overlay" hidden>
    <div class="shortcuts-panel">
      <div class="shortcuts-header">Keyboard Shortcuts</div>
      <div class="shortcuts-grid"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
